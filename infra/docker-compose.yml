name: routa

services:
  postgres:
    image: postgres:16
    container_name: routa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routa
      POSTGRES_PASSWORD: routa_dev_password
      POSTGRES_DB: routa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routa -d routa']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
